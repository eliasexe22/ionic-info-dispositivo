
<ion-header>
  <ion-toolbar>
    <ion-title>Información del dispositivo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label>Modelo</ion-label>
      <ion-note slot="end">{{ deviceInfo.model }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Plataforma</ion-label>
      <ion-note slot="end">{{ deviceInfo.platform }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Sistema operativo</ion-label>
      <ion-note slot="end">{{ deviceInfo.operatingSystem }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Versión del sistema</ion-label>
      <ion-note slot="end">{{ deviceInfo.osVersion }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Fabricante</ion-label>
      <ion-note slot="end">{{ deviceInfo.manufacturer }}</ion-note>
    </ion-item>
  </ion-list>
</ion-content>
